<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Todolist{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="sidebar">
    <a href="{{ url_for('main.dashboard') }}" class="sidebar-logo">
        <div class="logo-icon">
            <i class="fas fa-rocket"></i>
        </div>
        <span class="logo-text">EliasCorp</span>
    </a>
    <ul>
        <li>
            <a href="{{ url_for('main.dashboard') }}">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('main.tasks_page') }}">
                <i class="fas fa-tasks"></i>
                <span>Tâches</span>
            </a>
        </li>
    </ul>
</div>


<div class="main-panel">
    <nav class="navbar mb-4">
        <h4>{% block page_title %}Tableau de bord{% endblock %}</h4>
        <button id="sidebarToggle" class="btn btn-light"><i class="fas fa-bars"></i></button>
    </nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
