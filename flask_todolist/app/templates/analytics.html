{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-4" style="height: 100%; display: flex; flex-direction: column; overflow: hidden;">
    
    <!-- 1. En-tête avec les 4 compteurs KPI -->
    <div class="row g-3 mb-3 flex-shrink-0">
        <div class="col-md-3">
            <div class="bg-white p-3 border rounded-3 shadow-sm d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-secondary fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">TOTAL DES TÂCHES</div>
                    <div class="fs-4 fw-bold text-dark mt-1">{{ total }}</div>
                </div>
                <div class="p-2 bg-light rounded-circle text-primary"><i class="fas fa-list-check"></i></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="bg-white p-3 border rounded-3 shadow-sm d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-secondary fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">COMPLÉTÉES</div>
                    <div class="fs-4 fw-bold text-success mt-1">{{ completed }}</div>
                </div>
                <div class="p-2 bg-light rounded-circle text-success"><i class="fas fa-circle-check"></i></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="bg-white p-3 border rounded-3 shadow-sm d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-secondary fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">EN COURS</div>
                    <div class="fs-4 fw-bold text-warning mt-1">{{ pending }}</div>
                </div>
                <div class="p-2 bg-light rounded-circle text-warning"><i class="fas fa-clock"></i></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="bg-white p-3 border rounded-3 shadow-sm d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-secondary fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">HAUTE PRIORITÉ</div>
                    <div class="fs-4 fw-bold text-danger mt-1">{{ high }}</div>
                </div>
                <div class="p-2 bg-light rounded-circle text-danger"><i class="fas fa-triangle-exclamation"></i></div>
            </div>
        </div>
    </div>

    <!-- 2. Zone des 2 Grands Graphiques qui remplissent tout le carré -->
    <div class="row g-3 flex-grow-1" style="min-height: 0;">
        
        <!-- Graphique Donut (Statut) -->
        <div class="col-md-6 h-100">
            <div class="bg-white p-4 border rounded-3 shadow-sm h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
                    <h6 class="fw-bold mb-0" style="font-size: 0.95rem;">
                        <i class="fas fa-chart-pie me-2 text-primary"></i>Taux de réalisation
                    </h6>
                    <span class="badge bg-light text-muted border px-2 py-1">Sprint Actif</span>
                </div>
                
                <!-- Ce conteneur flex-grow-1 remplit 100% de la hauteur du carré -->
                <div style="flex: 1; min-height: 0; position: relative; width: 100%;">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Graphique Bâtons (Priorités) -->
        <div class="col-md-6 h-100">
            <div class="bg-white p-4 border rounded-3 shadow-sm h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
                    <h6 class="fw-bold mb-0" style="font-size: 0.95rem;">
                        <i class="fas fa-chart-simple me-2 text-primary"></i>Répartition par niveau d'urgence
                    </h6>
                    <span class="badge bg-light text-muted border px-2 py-1">Priorités</span>
                </div>
                
                <!-- Ce conteneur flex-grow-1 remplit 100% de la hauteur du carré -->
                <div style="flex: 1; min-height: 0; position: relative; width: 100%;">
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Graphique Donut (Grand et proportionné au carré)
    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: ['Complétées', 'En cours'],
            datasets: [{
                data: [{{ completed }}, {{ pending }}],
                backgroundColor: ['#10b981', '#f59e0b'],
                borderWidth: 3,
                borderColor: '#ffffff',
                hoverOffset: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: 10
            },
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        boxWidth: 14,
                        padding: 20,
                        font: { size: 13, family: 'Plus Jakarta Sans', weight: '600' }
                    }
                }
            },
            cutout: '62%' // Donut bien visible et volumineux
        }
    });

    // 2. Graphique Bâtons (Remplit toute la hauteur et la largeur du carré)
    new Chart(document.getElementById('priorityChart'), {
        type: 'bar',
        data: {
            labels: ['Haute', 'Moyenne', 'Basse'],
            datasets: [{
                label: 'Nombre de tâches',
                data: [{{ high }}, {{ med }}, {{ low }}],
                backgroundColor: ['#ef4444', '#f97316', '#3b82f6'],
                borderRadius: 8,
                maxBarThickness: 65 // Barres plus généreuses pour occuper l'espace
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        font: { size: 12, family: 'Plus Jakarta Sans' }
                    },
                    grid: {
                        color: '#f1f5f9'
                    }
                },
                x: {
                    grid: { display: false },
                    ticks: {
                        font: { size: 13, family: 'Plus Jakarta Sans', weight: '600' }
                    }
                }
            }
        }
    });
});
</script>
{% endblock %}
